concurrency:
  group: otel-demo-gke-${{ github.ref }}
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
jobs:
  apply_gke_asia_southeast3_ad_infra:
    defaults:
      run:
        working-directory: examples/otel-demo/outputs/otel_demo/gke-asia-southeast3/ad/infra
    if: '!cancelled() && !failure() && github.event_name == ''push'' && github.ref
      == ''refs/heads/main'' && needs.plan_gke_asia_southeast3_ad_infra.outputs.changes
      == ''true'''
    name: apply gke-asia-southeast3/ad/infra
    needs:
    - plan_gke_asia_southeast3_ad_infra
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      uses: actions/checkout@v4
    - id: google-credentials
      uses: google-github-actions/auth@v2
      with:
        service_account: ${{ vars.TF_APPLY_SERVICE_ACCOUNT }}
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    - id: setup-terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - id: plugin-cache-dir
      run: mkdir -p /home/runner/.terraform.d/plugin-cache
    - id: plugin-cache
      uses: actions/cache@v4
      with:
        key: tf-plugins-examples_otel_demo_outputs_otel_demo_gke_asia_southeast3_ad_infra-${{
          hashFiles('examples/otel-demo/outputs/otel_demo/gke-asia-southeast3/ad/infra/.terraform.lock.hcl')
          }}
        path: /home/runner/.terraform.d/plugin-cache
        restore-keys: tf-plugins-examples_otel_demo_outputs_otel_demo_gke_asia_southeast3_ad_infra-
    - id: init
      run: terraform init -lock-timeout=5m
    - id: download-plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-gke_asia_southeast3_ad_infra-${{ github.run_id }}
        path: examples/otel-demo/outputs/otel_demo/gke-asia-southeast3/ad/infra
    - id: apply
      run: terraform apply -auto-approve -lock-timeout=5m tfplan
