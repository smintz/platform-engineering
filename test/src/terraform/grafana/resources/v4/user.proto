syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaUser version is 0
message GrafanaUser {
  // The email address of the Grafana user.
  string email = 1;

  string id = 2;

  // Whether to make user an admin. Defaults to `false`.
  bool is_admin = 3 [json_name = "is_admin"];

  // The username for the Grafana user.
  string login = 4;

  // The display name for the Grafana user.
  string name = 5;

  // The password for the Grafana user.
  string password = 6;

  // The numerical ID of the Grafana user.
  int64 user_id = 7 [json_name = "user_id"];

  google.protobuf.Value for_each = 8 [json_name = "for_each"];

  repeated string depends_on = 9 [json_name = "depends_on"];

  int32 count = 10;

  string provider = 11;

  terraform.v1.Lifecycle lifecycle = 12;
}
