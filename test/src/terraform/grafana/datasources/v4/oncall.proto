// GrafanaOncallUsers version is 0
message GrafanaOncallUsers {
  string id = 1;

  repeated Users users = 2;

  google.protobuf.Value for_each = 3 [json_name = "for_each"];

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  terraform.v1.Lifecycle lifecycle = 7;

  message Users {
    // email: string
    string email = 1;

    // id: string
    string id = 2;

    // role: string
    string role = 3;

    // username: string
    string username = 4;
  }
}
