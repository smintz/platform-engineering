syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.datasources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaOncallEscalationChain version is 0
message GrafanaOncallEscalationChain {
  string id = 1;

  // The escalation chain name.
  string name = 2;

  google.protobuf.Value for_each = 3 [json_name = "for_each"];

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  terraform.v1.Lifecycle lifecycle = 7;
}

// GrafanaOncallIntegration version is 0
message GrafanaOncallIntegration {
  // The integration ID.
  string id = 1;

  // The inbound email for the integration. Only available for integration type
  // `inbound_email`.
  string inbound_email = 2 [json_name = "inbound_email"];

  // The link for the integration.
  string link = 3;

  // The integration name.
  string name = 4;

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  int32 count = 7;

  string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;
}

// GrafanaOncallLabel version is 0
message GrafanaOncallLabel {
  // The ID of the label.
  string id = 1;

  // The key for the label.
  string key = 2;

  // The value of the label.
  string value = 3;

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;
}

