syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.datasources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaLibraryPanel version is 0
message GrafanaLibraryPanel {
  // Timestamp when the library panel was created.
  string created = 1;

  // Numerical IDs of Grafana dashboards containing the library panel.
  repeated int64 dashboard_ids = 2 [json_name = "dashboard_ids"];

  // Description of the library panel.
  string description = 3;

  // Name of the folder containing the library panel.
  string folder_name = 4 [json_name = "folder_name"];

  // Unique ID (UID) of the folder containing the library panel.
  string folder_uid = 5 [json_name = "folder_uid"];

  string id = 6;

  // The JSON model for the library panel.
  string model_json = 7 [json_name = "model_json"];

  // Name of the library panel.
  string name = 8;

  // The Organization ID. If not set, the Org ID defined in the provider block will be
  // used.
  string org_id = 9 [json_name = "org_id"];

  // The numeric ID of the library panel computed by Grafana.
  int64 panel_id = 10 [json_name = "panel_id"];

  // Type of the library panel (eg. text).
  string type = 11;

  // The unique identifier (UID) of the library panel.
  string uid = 12;

  // Timestamp when the library panel was last modified.
  string updated = 13;

  // Version of the library panel.
  int64 version = 14;

  google.protobuf.Value for_each = 15 [json_name = "for_each"];

  repeated string depends_on = 16 [json_name = "depends_on"];

  int32 count = 17;

  string provider = 18;

  terraform.v1.Lifecycle lifecycle = 19;
}

// GrafanaLibraryPanels version is 0
message GrafanaLibraryPanels {
  string id = 1;

  // The Organization ID. If not set, the default organization is used for basic
  // authentication, or the one that owns your service account for token
  // authentication.
  string org_id = 2 [json_name = "org_id"];

  repeated Panels panels = 3;

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;

  message Panels {
    // description: string
    string description = 1;

    // folder_uid: string
    string folder_uid = 2 [json_name = "folder_uid"];

    // model_json: string
    string model_json = 3 [json_name = "model_json"];

    // name: string
    string name = 4;

    // uid: string
    string uid = 5;
  }
}
