syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.datasources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaUser version is 0
message GrafanaUser {
  // The email address of the Grafana user. Defaults to ``.
  string email = 1;

  string id = 2;

  // Whether the user is an admin.
  bool is_admin = 3 [json_name = "is_admin"];

  // The username for the Grafana user. Defaults to ``.
  string login = 4;

  // The display name for the Grafana user.
  string name = 5;

  // The numerical ID of the Grafana user. Defaults to `-1`.
  int64 user_id = 6 [json_name = "user_id"];

  google.protobuf.Value for_each = 7 [json_name = "for_each"];

  repeated string depends_on = 8 [json_name = "depends_on"];

  int32 count = 9;

  string provider = 10;

  terraform.v1.Lifecycle lifecycle = 11;
}
