syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.datasources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaSlos version is 0
message GrafanaSlos {
  // The ID of this datasource. This is a constant value.
  string id = 1;

  repeated Slos slos = 2;

  google.protobuf.Value for_each = 3 [json_name = "for_each"];

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  terraform.v1.Lifecycle lifecycle = 7;

  message Slos {
    // Description of the SLO.
    string description = 1;

    // Name of the SLO.
    string name = 2;

    // The Knowledge Graph search expression scoping this SLO to a set of entities. When
    // set, the SLO links to the Asserts RCA workbench and its burn-rate alert rules
    // carry a `workbench_troubleshoot_url` annotation.
    string search_expression = 3 [json_name = "search_expression"];

    // A unique, random identifier. This value is read-only.
    string uuid = 4;

    repeated Alerting alerting = 5;

    repeated DestinationDatasource destination_datasource = 6 [json_name = "destination_datasource"];

    repeated Label label = 7;

    repeated Objectives objectives = 8;

    repeated Query query = 9;

    message Alerting {
      repeated AdvancedOptions advanced_options = 1 [json_name = "advanced_options"];

      repeated Annotation annotation = 2;

      repeated Fastburn fastburn = 3;

      repeated Label label = 4;

      repeated Slowburn slowburn = 5;

      message AdvancedOptions {
        // Minimum number of failures before alerting.
        int64 min_failures = 1 [json_name = "min_failures"];
      }

      message Annotation {
        // Key for filtering and identification.
        string key = 1;

        // Templatable value.
        string value = 2;
      }

      message Fastburn {
        repeated Annotation annotation = 1;

        repeated Enrichment enrichment = 2;

        repeated Label label = 3;

        message Annotation {
          // Key for filtering and identification.
          string key = 1;

          // Templatable value.
          string value = 2;
        }

        message Enrichment {
          // Type of the alert enrichment.
          string type = 1;
        }

        message Label {
          // Key for filtering and identification.
          string key = 1;

          // Templatable value.
          string value = 2;
        }
      }

      message Label {
        // Key for filtering and identification.
        string key = 1;

        // Templatable value.
        string value = 2;
      }

      message Slowburn {
        repeated Annotation annotation = 1;

        repeated Enrichment enrichment = 2;

        repeated Label label = 3;

        message Annotation {
          // Key for filtering and identification.
          string key = 1;

          // Templatable value.
          string value = 2;
        }

        message Enrichment {
          // Type of the alert enrichment.
          string type = 1;
        }

        message Label {
          // Key for filtering and identification.
          string key = 1;

          // Templatable value.
          string value = 2;
        }
      }
    }

    message DestinationDatasource {
      // UID of the destination datasource.
      string uid = 1;
    }

    message Label {
      // Key for filtering and identification.
      string key = 1;

      // Templatable value.
      string value = 2;
    }

    message Objectives {
      // Objective value (between 0 and 1).
      int64 value = 1;

      // Time window for the objective.
      string window = 2;
    }

    message Query {
      // Type of query (freeform, ratio, grafana_queries, etc.).
      string type = 1;

      repeated Freeform freeform = 2;

      repeated GrafanaQueries grafana_queries = 3 [json_name = "grafana_queries"];

      repeated Ratio ratio = 4;

      message Freeform {
        // The PromQL query string.
        string query = 1;
      }

      message GrafanaQueries {
        // JSON string containing the Grafana queries.
        string grafana_queries = 1 [json_name = "grafana_queries"];
      }

      message Ratio {
        // Labels used for grouping.
        repeated string group_by_labels = 1 [json_name = "group_by_labels"];

        // Counter metric for success events (numerator).
        string success_metric = 2 [json_name = "success_metric"];

        // Metric for total events (denominator).
        string total_metric = 3 [json_name = "total_metric"];
      }
    }
  }
}
