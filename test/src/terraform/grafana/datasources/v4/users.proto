syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.datasources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaUsers version is 0
message GrafanaUsers {
  string id = 1;

  // The Grafana instance's users.
  repeated Users users = 2;

  google.protobuf.Value for_each = 3 [json_name = "for_each"];

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  terraform.v1.Lifecycle lifecycle = 7;

  message Users {
    // email: string
    string email = 1;

    // id: number
    int64 id = 2;

    // is_admin: bool
    bool is_admin = 3 [json_name = "is_admin"];

    // login: string
    string login = 4;

    // name: string
    string name = 5;
  }
}
