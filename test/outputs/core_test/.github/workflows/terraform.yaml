concurrency:
  group: terraform-${{ github.ref }}
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
jobs:
  apply_us_east_1_api_task_infra:
    defaults:
      run:
        working-directory: test/outputs/core_test/us-east-1/api-task/infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan_us_east_1_api_task_infra.outputs.changes
      == 'true'
    name: apply us-east-1/api-task/infra
    needs:
    - plan_us_east_1_api_task_infra
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      uses: actions/checkout@v4
    - id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        role-to-assume: ${{ vars.TF_APPLY_ROLE }}
    - id: setup-terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - id: plugin-cache-dir
      run: mkdir -p /home/runner/.terraform.d/plugin-cache
    - id: plugin-cache
      uses: actions/cache@v4
      with:
        key: tf-plugins-test_outputs_core_test_us_east_1_api_task_infra-${{ hashFiles('test/outputs/core_test/us-east-1/api-task/infra/.terraform.lock.hcl')
          }}
        path: /home/runner/.terraform.d/plugin-cache
        restore-keys: tf-plugins-test_outputs_core_test_us_east_1_api_task_infra-
    - id: init
      run: terraform init -lock-timeout=5m
    - id: download-plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-us_east_1_api_task_infra-${{ github.run_id }}
        path: test/outputs/core_test/us-east-1/api-task/infra
    - id: apply
      run: terraform apply -auto-approve -lock-timeout=5m tfplan
  apply_us_east_1_api_task_monitoring:
    defaults:
      run:
        working-directory: test/outputs/core_test/us-east-1/api-task/monitoring
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan_us_east_1_api_task_monitoring.outputs.changes
      == 'true'
    name: apply us-east-1/api-task/monitoring
    needs:
    - plan_us_east_1_api_task_monitoring
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      uses: actions/checkout@v4
    - id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        role-to-assume: ${{ vars.TF_APPLY_ROLE }}
    - id: grafana-token
      run: |
        set -euo pipefail

        ws="${{ vars.GRAFANA_WORKSPACE_ID }}"
        account="protoconf-apply"

        sa=$(aws grafana list-workspace-service-accounts --workspace-id "$ws" \
          --query "serviceAccounts[?name=='$account'].id | [0]" --output text)
        if [ -z "$sa" ] || [ "$sa" = "None" ]; then
          echo "::error::no Grafana service account named $account in workspace $ws - apply the grafana state first"
          exit 1
        fi

        # Grafana keeps expired tokens on the account, and this job cannot touch the live ones
        # belonging to the jobs running beside it, so it collects the dead and leaves the rest.
        now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        aws grafana list-workspace-service-account-tokens --workspace-id "$ws" --service-account-id "$sa" \
          | jq -r --arg now "$now" '.serviceAccountTokens[] | select(.expiresAt[0:19] < $now[0:19]) | .id' \
          | while read -r dead; do
              aws grafana delete-workspace-service-account-token \
                --workspace-id "$ws" --service-account-id "$sa" --token-id "$dead" >/dev/null || true
            done

        key=$(aws grafana create-workspace-service-account-token --workspace-id "$ws" --service-account-id "$sa" \
          --name "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" --seconds-to-live 1800 \
          --query 'serviceAccountToken.key' --output text)
        echo "::add-mask::$key"

        {
          echo "GRAFANA_AUTH=$key"
          echo "GRAFANA_URL=https://$(aws grafana describe-workspace --workspace-id "$ws" \
            --query 'workspace.endpoint' --output text)"
        } >> "$GITHUB_ENV"
    - id: setup-terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - id: plugin-cache-dir
      run: mkdir -p /home/runner/.terraform.d/plugin-cache
    - id: plugin-cache
      uses: actions/cache@v4
      with:
        key: tf-plugins-test_outputs_core_test_us_east_1_api_task_monitoring-${{ hashFiles('test/outputs/core_test/us-east-1/api-task/monitoring/.terraform.lock.hcl')
          }}
        path: /home/runner/.terraform.d/plugin-cache
        restore-keys: tf-plugins-test_outputs_core_test_us_east_1_api_task_monitoring-
    - id: init
      run: terraform init -lock-timeout=5m
    - id: download-plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-us_east_1_api_task_monitoring-${{ github.run_id }}
        path: test/outputs/core_test/us-east-1/api-task/monitoring
    - id: apply
      run: terraform apply -auto-approve -lock-timeout=5m tfplan
