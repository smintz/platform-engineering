// GoogleServiceAccount version is 0
message GoogleServiceAccount {
  // The account id that is used to generate the service account email address and a
  // stable unique id. It is unique within a project, must be 6-30 characters long,
  // and match the regular expression [a-z]([-a-z0-9]*[a-z0-9]) to comply with
  // RFC1035. Changing this forces a new service account to be created.
  optional string account_id = 1 [json_name = "account_id"];

  // If set to true, skip service account creation if a service account with the same
  // email already exists.
  optional bool create_ignore_already_exists = 2 [json_name = "create_ignore_already_exists"];

  // Whether Terraform will be prevented from destroying the instance. Defaults to
  // "DELETE".
  //
  // When a 'terraform destroy' or 'terraform apply' would delete the instance,
  //
  // the command will fail if this field is set to "PREVENT" in Terraform state.
  //
  // When set to "ABANDON", the command will remove the resource from Terraform
  //
  // management without updating or deleting the resource in the API.
  //
  // When set to "DELETE", deleting the resource is allowed.
  optional string deletion_policy = 3 [json_name = "deletion_policy"];

  // A text description of the service account. Must be less than or equal to 256
  // UTF-8 bytes.
  optional string description = 4;

  // Whether the service account is disabled. Defaults to false
  optional bool disabled = 5;

  // The display name for the service account. Can be updated without creating a new
  // resource.
  optional string display_name = 6 [json_name = "display_name"];

  // The e-mail address of the service account. This value should be referenced from
  // any google_iam_policy data sources that would grant the service account
  // privileges.
  optional string email = 7;

  optional string id = 8;

  // The Identity of the service account in the form 'serviceAccount:{email}'. This
  // value is often used to refer to the service account in order to grant IAM
  // permissions.
  optional string member = 9;

  // The fully-qualified name of the service account.
  optional string name = 10;

  // The ID of the project that the service account will be created in. Defaults to
  // the provider project configuration.
  optional string project = 11;

  // The unique id of the service account.
  optional string unique_id = 12 [json_name = "unique_id"];

  repeated Timeouts timeouts = 13;

  google.protobuf.Value for_each = 14 [json_name = "for_each"];

  repeated string depends_on = 15 [json_name = "depends_on"];

  optional int32 count = 16;

  optional string provider = 17;

  terraform.v1.Lifecycle lifecycle = 18;

  message Timeouts {
    optional string create = 1;
  }
}

