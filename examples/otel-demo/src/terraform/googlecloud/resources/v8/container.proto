      // node.
      optional string mode = 1;
    }
  }

  message NodeDrainConfig {
    // The duration of the grace termination period for node drain.
    optional string grace_termination_duration = 1 [json_name = "grace_termination_duration"];

    // The duration of the PDB timeout period for node drain.
    optional string pdb_timeout_duration = 2 [json_name = "pdb_timeout_duration"];

    // Whether to respect PodDisruptionBudget policy during node pool deletion.
    optional bool respect_pdb_during_node_pool_deletion = 3 [
      json_name = "respect_pdb_during_node_pool_deletion"
    ];
  }

  message PlacementPolicy {
    // If set, refers to the name of a custom resource policy supplied by the user. The
    // resource policy must be in the same project and region as the node pool. If not
    // found, InvalidArgument error is returned.
    optional string policy_name = 1 [json_name = "policy_name"];

    // The TPU topology like "2x4" or "2x2x2".
    // https://cloud.google.com/kubernetes-engine/docs/concepts/plan-tpus#topology
    optional string tpu_topology = 2 [json_name = "tpu_topology"];

    // Type defines the type of placement policy
    optional string type = 3;
  }

  message QueuedProvisioning {
    // Whether nodes in this node pool are obtainable solely through the
    // ProvisioningRequest API
    optional bool enabled = 1;
  }

  message Timeouts {
    optional string create = 1;

    optional string delete = 2;

    optional string update = 3;
  }

  message UpgradeSettings {
    // The number of additional nodes that can be added to the node pool during an
    // upgrade. Increasing max_surge raises the number of nodes that can be upgraded
    // simultaneously. Can be set to 0 or greater.
    optional int64 max_surge = 1 [json_name = "max_surge"];

    // The number of nodes that can be simultaneously unavailable during an upgrade.
    // Increasing max_unavailable raises the number of nodes that can be upgraded in
    // parallel. Can be set to 0 or greater.
    optional int64 max_unavailable = 2 [json_name = "max_unavailable"];

    // Update strategy for the given nodepool.
    optional string strategy = 3;

    BlueGreenSettings blue_green_settings = 4 [json_name = "blue_green_settings"];

    message BlueGreenSettings {
      // Time needed after draining entire blue pool. After this period, blue pool will be
      // cleaned up.
      optional string node_pool_soak_duration = 1 [json_name = "node_pool_soak_duration"];

      StandardRolloutPolicy standard_rollout_policy = 2 [json_name = "standard_rollout_policy"];

      message StandardRolloutPolicy {
        // Number of blue nodes to drain in a batch.
        optional int64 batch_node_count = 1 [json_name = "batch_node_count"];

        // Percentage of the blue pool nodes to drain in a batch.
        optional int64 batch_percentage = 2 [json_name = "batch_percentage"];

        // Soak time after each batch gets drained.
        optional string batch_soak_duration = 3 [json_name = "batch_soak_duration"];
      }
    }
  }
}

// GoogleContainerRegistry version is 0
message GoogleContainerRegistry {
  // The URI of the created resource.
  optional string bucket_self_link = 1 [json_name = "bucket_self_link"];

  optional string id = 2;

  // The location of the registry. One of ASIA, EU, US or not specified. See the
  // official documentation for more information on registry locations.
  optional string location = 3;

  // The ID of the project in which the resource belongs. If it is not provided, the
  // provider project is used.
  optional string project = 4;

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  optional int32 count = 7;

  optional string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;
}
