syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.datasources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaCloudAccessPolicies version is 0
message GrafanaCloudAccessPolicies {
  repeated AccessPolicies access_policies = 1 [json_name = "access_policies"];

  // The ID of this datasource. This is an internal identifier used by the provider to
  // track this datasource.
  string id = 2;

  // If set, only access policies with the specified name will be returned. This is
  // faster than filtering in Terraform.
  string name_filter = 3 [json_name = "name_filter"];

  // If set, only access policies in the specified region will be returned. Otherwise,
  // fetches from all available regions (more resource intensive).
  string region_filter = 4 [json_name = "region_filter"];

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  int32 count = 7;

  string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;

  message AccessPolicies {
    // display_name: string
    string display_name = 1 [json_name = "display_name"];

    // id: string
    string id = 2;

    // name: string
    string name = 3;

    // region: string
    string region = 4;

    // status: string
    string status = 5;
  }
}

