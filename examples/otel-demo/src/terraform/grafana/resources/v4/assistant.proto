syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaAssistantMcpServer version is 0
message GrafanaAssistantMcpServer {
  // Applications where this resource applies. Valid values: `assistant`, `loop`,
  // `all`. Defaults to all applications when unset.
  repeated string applications = 1;

  // Custom HTTP headers sent to the MCP server. Values are write-only and not
  // returned by the API.
  map<string, string> custom_headers = 2 [json_name = "custom_headers"];

  // Optional description.
  string description = 3;

  // Whether the resource is enabled.
  bool enabled = 4;

  // The UUID of the resource.
  string id = 5;

  // The MCP server integration name.
  string name = 6;

  // Whether the resource is visible to the whole tenant (`tenant`) or only the
  // creating user (`user`).
  string scope = 7;

  repeated Configuration configuration = 8;

  google.protobuf.Value for_each = 9 [json_name = "for_each"];

  repeated string depends_on = 10 [json_name = "depends_on"];

  int32 count = 11;

  string provider = 12;

  terraform.v1.Lifecycle lifecycle = 13;

  message Configuration {
    // Built-in provider ID (e.g. cursor). When set, tools are provided locally.
    string builtin_id = 1 [json_name = "builtin_id"];

    // Tool approval policies keyed by tool name (`auto_approve`, `always_ask`, or empty
    // for default).
    map<string, string> tool_approval_policies = 2 [json_name = "tool_approval_policies"];

    // Tool preferences keyed by tool name (`enabled` or `disabled`).
    map<string, string> tool_preferences = 3 [json_name = "tool_preferences"];

    // MCP server URL.
    string url = 4;
  }
}

// GrafanaAssistantQuickstart version is 0
message GrafanaAssistantQuickstart {
  // Optional JSON-encoded array of context items pre-attached to the quickstart. Each
  // element is an Assistant `ChatContextItem`; only `node.id`, `node.name`, and
  // `node.data` (`{"type": ..., "data": {...}}`) are required, e.g. `{"node": {"id":
  // ..., "name": ..., "data": {"type": ..., "data": {...}}}}`. This is an advanced,
  // internal-format field. The most reliable way to produce a valid value is to
  // create a quickstart with the desired context through the Assistant UI, then copy
  // the resulting `contextItems` JSON. Omit this field if no pre-attached context is
  // needed. See the example for a typical datasource context item.
  string context_items = 1 [json_name = "context_items"];

  // Whether the resource is enabled.
  bool enabled = 2;

  // The UUID of the resource.
  string id = 3;

  // The quickstart question text.
  string prompt = 4;

  // Whether the resource is visible to the whole tenant (`tenant`) or only the
  // creating user (`user`).
  string scope = 5;

  // Optional title for the quickstart.
  string title = 6;

  google.protobuf.Value for_each = 7 [json_name = "for_each"];

  repeated string depends_on = 8 [json_name = "depends_on"];

  int32 count = 9;

  string provider = 10;

  terraform.v1.Lifecycle lifecycle = 11;
}

// GrafanaAssistantRule version is 0
message GrafanaAssistantRule {
  // Applications where this resource applies. Valid values: `assistant`, `loop`,
  // `infrastructure_memory` (rules only), `all`. Defaults to all applications when
  // unset.
  repeated string applications = 1;

  // Optional description of the rule.
  string description = 2;

  // Whether the resource is enabled.
  bool enabled = 3;

  // The UUID of the resource.
  string id = 4;

  // The rule name.
  string name = 5;

  // Rule priority (lower values apply first).
  int64 priority = 6;

  // The rule text included in the assistant system prompt.
  string rule_content = 7 [json_name = "rule_content"];

  // Whether the resource is visible to the whole tenant (`tenant`) or only the
  // creating user (`user`).
  string scope = 8;

  google.protobuf.Value for_each = 9 [json_name = "for_each"];

  repeated string depends_on = 10 [json_name = "depends_on"];

  int32 count = 11;

  string provider = 12;

  terraform.v1.Lifecycle lifecycle = 13;
}

// GrafanaAssistantSkill version is 0
message GrafanaAssistantSkill {
  // The skill content.
  string body = 1;

  // The slash command name that invokes the skill. Setting this enables the skill as
  // a command.
  string command_name = 2 [json_name = "command_name"];

  // Optional JSON array of context items referenced by the skill.
  string context_items = 3 [json_name = "context_items"];

  // The UUID of the resource.
  string id = 4;

  // Whether the skill is included in the knowledgebase.
  bool include_in_knowledgebase = 5 [json_name = "include_in_knowledgebase"];

  // The skill name.
  string name = 6;

  // Whether the resource is visible to the whole tenant (`tenant`) or only the
  // creating user (`user`).
  string scope = 7;

  repeated AllowedTools allowed_tools = 8 [json_name = "allowed_tools"];

  google.protobuf.Value for_each = 9 [json_name = "for_each"];

  repeated string depends_on = 10 [json_name = "depends_on"];

  int32 count = 11;

  string provider = 12;

  terraform.v1.Lifecycle lifecycle = 13;

  message AllowedTools {
    // Integration UUID.
    string integration_id = 1 [json_name = "integration_id"];

    // MCP tool name.
    string tool_name = 2 [json_name = "tool_name"];
  }
}

// GrafanaAssistantTermsAcceptance version is 0
message GrafanaAssistantTermsAcceptance {
  // Whether the current Grafana Assistant terms are accepted for the stack. Setting
  // this to `false` withdraws acceptance.
  bool accepted = 1;

  // The fixed identifier for the stack's Assistant terms acceptance.
  string id = 2;

  google.protobuf.Value for_each = 3 [json_name = "for_each"];

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  terraform.v1.Lifecycle lifecycle = 7;
}
