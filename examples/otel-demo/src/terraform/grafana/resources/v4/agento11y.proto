syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaAgento11yCollection version is 0
message GrafanaAgento11yCollection {
  // Description of the collection. Remove this attribute to clear the stored
  // description; an empty string is not accepted.
  string description = 1;

  // The server-generated collection identifier.
  string id = 2;

  // Display name of the collection. Names are not unique.
  string name = 3;

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;
}

// GrafanaAgento11yEvaluationRule version is 0
message GrafanaAgento11yEvaluationRule {
  // Optional Grafana alert rule UIDs associated with this evaluation rule.
  repeated string alert_rule_uids = 1 [json_name = "alert_rule_uids"];

  // Whether the rule is enabled. Defaults to `true`.
  bool enabled = 2;

  // IDs of the evaluators to run against matching generations. Must be non-empty.
  repeated string evaluator_ids = 3 [json_name = "evaluator_ids"];

  // How evaluators execute. `parallel` runs all evaluators independently;
  // `sequential` treats `evaluator_ids` as an ordered gate chain. Defaults to
  // `parallel`.
  string execution_mode = 4 [json_name = "execution_mode"];

  // Generation tag keys to promote to Prometheus labels on evaluation metrics.
  // Supports at most 10 unique, non-empty keys and cannot be set when `selector` is
  // `conversation`.
  repeated string filterable_tag_keys = 5 [json_name = "filterable_tag_keys"];

  // The rule identifier (equal to `rule_id`).
  string id = 6;

  // Optional JSON object of match filters (for example
  // `{"agent_name":"checkout-*"}`). Omit to match everything.
  string match = 7;

  // Idle window, in seconds, before a conversation-scope rule runs. Required when
  // `selector` is `conversation`; must be unset otherwise.
  int64 min_idle_seconds = 8 [json_name = "min_idle_seconds"];

  // Tenant-unique identifier of the rule. Changing this forces a new resource.
  string rule_id = 9 [json_name = "rule_id"];

  // Fraction of matching generations to evaluate, in `[0,1]`. Defaults to `0.01`.
  int64 sample_rate = 10 [json_name = "sample_rate"];

  // Which generations the rule applies to. One of `user_visible_turn`,
  // `all_assistant_generations`, `tool_call_steps`, `errored_generations`,
  // `conversation`. Defaults to `user_visible_turn`.
  string selector = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;
}

// GrafanaAgento11yEvaluator version is 0
message GrafanaAgento11yEvaluator {
  // Kind-specific evaluator configuration, encoded as a JSON object string. The
  // server normalizes this payload, so it is managed from configuration and not
  // refreshed from the API.
  string config = 1;

  // Optional human-readable description of the evaluator.
  string description = 2;

  // Tenant-unique identifier of the evaluator. Changing this forces a new resource.
  string evaluator_id = 3 [json_name = "evaluator_id"];

  // The evaluator identifier (equal to `evaluator_id`).
  string id = 4;

  // The evaluator kind. One of `llm_judge`, `json_schema`, `regex`, `heuristic`.
  string kind = 5;

  // JSON array of output key definitions produced by the evaluator (for example
  // `[{"key":"score","type":"number","pass_threshold":0.5}]`). Managed from
  // configuration and not refreshed from the API.
  string output_keys = 6 [json_name = "output_keys"];

  // Version label of the evaluator definition.
  string version = 7;

  google.protobuf.Value for_each = 8 [json_name = "for_each"];

  repeated string depends_on = 9 [json_name = "depends_on"];

  int32 count = 10;

  string provider = 11;

  terraform.v1.Lifecycle lifecycle = 12;
}

// GrafanaAgento11yHookRule version is 0
message GrafanaAgento11yHookRule {
  // Action taken when the hook fails. One of `deny`, `warn`. Defaults to `deny`.
  string action_on_fail = 1 [json_name = "action_on_fail"];

  // Glob patterns of tool call names to block (for example `["delete_*"]`).
  repeated string blocked_tools = 2 [json_name = "blocked_tools"];

  // Whether the hook rule is enabled. Defaults to `true`.
  bool enabled = 3;

  // IDs of the evaluators to run synchronously. Optional when `blocked_tools` or
  // `redact` is set.
  repeated string evaluator_ids = 4 [json_name = "evaluator_ids"];

  // The hook rule identifier (equal to `rule_id`).
  string id = 5;

  // Optional JSON object of match filters (for example
  // `{"agent_name":"checkout-*"}`). Omit to match everything.
  string match = 6;

  // When the hook runs. One of `preflight`, `postflight`. Defaults to `preflight`.
  string phase = 7;

  // Evaluation priority; lower priority rules run first. Defaults to `0`.
  int64 priority = 8;

  // Tenant-unique identifier of the hook rule. Changing this forces a new resource.
  string rule_id = 9 [json_name = "rule_id"];

  // Which generations the hook applies to. One of `all`, `user_visible_turn`,
  // `all_assistant_generations`, `tool_call_steps`, `errored_generations`. Defaults
  // to `all`.
  string selector = 10;

  // When `true` (default), stop at the first failed rule. When `false`, run all
  // evaluators and deny if any failed.
  bool short_circuit = 11 [json_name = "short_circuit"];

  repeated Redact redact = 12;

  google.protobuf.Value for_each = 13 [json_name = "for_each"];

  repeated string depends_on = 14 [json_name = "depends_on"];

  int32 count = 15;

  string provider = 16;

  terraform.v1.Lifecycle lifecycle = 17;

  message Redact {
    // Optional stable identifier for the pattern.
    string id = 1;

    // Regular expression to redact.
    string regex = 2;
  }
}

// GrafanaAgento11yRuleAction version is 0
message GrafanaAgento11yRuleAction {
  // IDs of the collections that matching conversations are added to. Must be
  // non-empty.
  repeated string collection_ids = 1 [json_name = "collection_ids"];

  // Aggregate verdict that triggers the action. One of `all_evaluators_pass`,
  // `all_evaluators_fail`.
  string condition = 2;

  // Whether the action is enabled. Defaults to `true`.
  bool enabled = 3;

  // The server-generated action identifier.
  string id = 4;

  // ID of the evaluation rule this action is attached to. Changing this forces a new
  // resource.
  string rule_id = 5 [json_name = "rule_id"];

  google.protobuf.Value for_each = 6 [json_name = "for_each"];

  repeated string depends_on = 7 [json_name = "depends_on"];

  int32 count = 8;

  string provider = 9;

  terraform.v1.Lifecycle lifecycle = 10;
}
