// GrafanaAssertsPromRuleFile version is 0
message GrafanaAssertsPromRuleFile {
  // Whether the rules file is active. Inactive rules are not evaluated. Defaults to
  // `true`.
  bool active = 1;

  string id = 2;

  // The name of the Prometheus rules file. This will be stored with a .custom
  // extension. Must follow naming validation rules (alphanumeric, hyphens,
  // underscores).
  string name = 3;

  repeated Group group = 4;

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  int32 count = 7;

  string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;

  message Group {
    // Evaluation interval for this group (e.g., '30s', '1m'). If not specified, uses
    // the global evaluation interval.
    string interval = 1;

    // The name of the rule group (e.g., 'latency_monitoring').
    string name = 2;

    repeated Rule rule = 3;

    message Rule {
      // Whether this specific rule is active. This field is read-only and controlled by
      // the API.
      bool active = 1;

      // The name of the alert for alerting rules. Either 'record' or 'alert' must be
      // specified, but not both.
      string alert = 2;

      // Annotations to add to alerts (e.g., summary, description).
      map<string, string> annotations = 3;

      // List of group names where this rule should be disabled. Useful for conditional
      // rule enablement.
      repeated string disable_in_groups = 4 [json_name = "disable_in_groups"];

      // How long the condition must be true before firing the alert (e.g., '5m'). Only
      // applicable for alerting rules. Maps to 'for' in Prometheus.
      string duration = 5;

      // The PromQL expression to evaluate.
      string expr = 6;

      // Labels to attach to the resulting time series or alert.
      map<string, string> labels = 7;

      // The name of the time series to output for recording rules. Either 'record' or
      // 'alert' must be specified, but not both.
      string record = 8;
    }
  }
}

// GrafanaAssertsStack version is 0
message GrafanaAssertsStack {
  // A Grafana Cloud Access Policy token with the following scopes: `stacks:read`,
  // `metrics:read`, `metrics:write`. This token is used for GCom API access, Mimir
  // authentication, and assertion detector webhook authentication.
  string cloud_access_policy_token = 1 [json_name = "cloud_access_policy_token"];

  // Whether the stack is currently enabled.
  bool enabled = 2;

  // A Grafana Service Account token for installing dashboards and Grafana Managed
  // Alerts. Required permissions: `dashboards:create`, `dashboards:write`,
  // `dashboards:read`, `folders:create`, `folders:write`, `folders:read`,
  // `folders:delete`, `datasources:read`, `datasources:query`,
  // `alert.provisioning:write`, `alert.notifications.provisioning:write`,
  // `alert.notifications:write`, `alert.rules:read`, `alert.rules:create`,
  // `alert.rules:delete`. Create using `grafana_cloud_stack_service_account_token`
  // resource.
  string grafana_token = 3 [json_name = "grafana_token"];

  string id = 4;

  // Current onboarding status of the stack.
  string status = 5;

  // Configuration version number.
  int64 version = 6;

  repeated Dataset dataset = 7;

  repeated Timeouts timeouts = 8;

  google.protobuf.Value for_each = 9 [json_name = "for_each"];

  repeated string depends_on = 10 [json_name = "depends_on"];

  int32 count = 11;

  string provider = 12;

  terraform.v1.Lifecycle lifecycle = 13;

  message Dataset {
    // List of vendors to disable for this dataset.
    repeated string disabled_vendors = 1 [json_name = "disabled_vendors"];

    // The dataset type. Available types: `kubernetes`, `otel` (App O11y), `prometheus`,
    // `aws`. Note: `kubernetes` requires K8s Monitoring to be enabled, and `otel`
    // requires Application Observability to be enabled on the stack.
    string type = 2;

    repeated FilterGroup filter_group = 3 [json_name = "filter_group"];

    message FilterGroup {
      // The metric label name used for environment (e.g., `env`, `environment`,
      // `deployment_environment`). Defaults to standard labels if not set.
      string env_label = 1 [json_name = "env_label"];

      // Specific values of the environment label to match.
      repeated string env_label_values = 2 [json_name = "env_label_values"];

      // A friendly name for the environment.
      string env_name = 3 [json_name = "env_name"];

      // The metric label name used for site/cluster.
      string site_label = 4 [json_name = "site_label"];

      // Specific values of the site label to match.
      repeated string site_label_values = 5 [json_name = "site_label_values"];

      repeated Filter filter = 6;

      message Filter {
        // The label name to filter on.
        string name = 1;

        // The filter operator (e.g., `=`, `!=`, `=~`, `!~`).
        string operator = 2;

        // The values to match.
        repeated string values = 3;
      }
    }
  }

  message Timeouts {
    string create = 1;

    string delete = 2;

    string read = 3;

    string update = 4;
  }
}

