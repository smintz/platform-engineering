// GrafanaAssertsThresholds version is 0
message GrafanaAssertsThresholds {
  string id = 1;

  repeated HealthThresholds health_thresholds = 2 [json_name = "health_thresholds"];

  repeated RequestThresholds request_thresholds = 3 [json_name = "request_thresholds"];

  repeated ResourceThresholds resource_thresholds = 4 [json_name = "resource_thresholds"];

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  int32 count = 7;

  string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;

  message HealthThresholds {
    // Optional alert category label for the health threshold.
    string alert_category = 1 [json_name = "alert_category"];

    // Assertion name.
    string assertion_name = 2 [json_name = "assertion_name"];

    // Entity type for the health threshold (e.g., Service, Pod, Namespace, Volume).
    string entity_type = 3 [json_name = "entity_type"];

    // Prometheus expression.
    string expression = 4;
  }

  message RequestThresholds {
    // Assertion name (e.g., RequestRateAnomaly, ErrorRatioBreach).
    string assertion_name = 1 [json_name = "assertion_name"];

    // Entity name the threshold applies to.
    string entity_name = 2 [json_name = "entity_name"];

    // Request context (e.g., path or context identifier).
    string request_context = 3 [json_name = "request_context"];

    // Request type (e.g., inbound/outbound).
    string request_type = 4 [json_name = "request_type"];

    // Threshold value.
    int64 value = 5;
  }

  message ResourceThresholds {
    // Assertion name (e.g., Saturation, ResourceRateBreach).
    string assertion_name = 1 [json_name = "assertion_name"];

    // Container name.
    string container_name = 2 [json_name = "container_name"];

    // Resource type (e.g., container/pod/node).
    string resource_type = 3 [json_name = "resource_type"];

    // Severity (warning or critical).
    string severity = 4;

    // Data source for the threshold (e.g., metrics/logs).
    string source = 5;

    // Threshold value.
    int64 value = 6;
  }
}

