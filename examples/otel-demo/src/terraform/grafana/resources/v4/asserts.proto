syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaAssertsCustomModelRules version is 0
message GrafanaAssertsCustomModelRules {
  string id = 1;

  // The name of the custom model rules.
  string name = 2;

  Rules rules = 3;

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;

  message Rules {
    repeated Entity entity = 1;

    message Entity {
      // Whether this entity is disabled.
      bool disabled = 1;

      // List of enrichment sources for the entity.
      repeated string enriched_by = 2 [json_name = "enriched_by"];

      // Lookup mappings for the entity.
      map<string, string> lookup = 3;

      // The name of the entity.
      string name = 4;

      // Scope labels for the entity.
      map<string, string> scope = 5;

      // The type of the entity (e.g., Service, Pod, Namespace).
      string type = 6;

      repeated DefinedBy defined_by = 7 [json_name = "defined_by"];

      message DefinedBy {
        // Whether this rule is disabled. When true, only the 'query' field is used to match
        // an existing rule to disable; other fields are ignored.
        bool disabled = 1;

        // Label value mappings for the query.
        map<string, string> label_values = 2 [json_name = "label_values"];

        // Literal value mappings for the query.
        map<string, string> literals = 3;

        // Metric value for the query.
        string metric_value = 4 [json_name = "metric_value"];

        // The Prometheus query that defines this entity.
        string query = 5;
      }
    }
  }
}

// GrafanaAssertsLogConfig version is 0
message GrafanaAssertsLogConfig {
  // DataSource to be queried (e.g., a Loki instance).
  string data_source_uid = 1 [json_name = "data_source_uid"];

  // Is it the default config, therefore undeletable?
  bool default_config = 2 [json_name = "default_config"];

  // Mapping of entity properties to log labels.
  map<string, string> entity_property_to_log_label_mapping = 3 [json_name = "entity_property_to_log_label_mapping"];

  // Error label to filter logs.
  string error_label = 4 [json_name = "error_label"];

  // Filter logs by span ID.
  bool filter_by_span_id = 5 [json_name = "filter_by_span_id"];

  // Filter logs by trace ID.
  bool filter_by_trace_id = 6 [json_name = "filter_by_trace_id"];

  string id = 7;

  // The name of the log configuration.
  string name = 8;

  // Priority of the log configuration. A lower number means a higher priority.
  int64 priority = 9;

  repeated Match match = 10;

  repeated Timeouts timeouts = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;

  message Match {
    // Operation to use for matching. One of: =, <>, <, >, <=, >=, IS NULL, IS NOT NULL,
    // STARTS WITH, CONTAINS.
    string op = 1;

    // Entity property to match.
    string property = 2;

    // Values to match against. Required for all operators except "IS NULL" and "IS NOT
    // NULL", which must not have any values.
    repeated string values = 3;
  }

  message Timeouts {
    string create = 1;

    string delete = 2;

    string read = 3;

    string update = 4;
  }
}

// GrafanaAssertsNotificationAlertsConfig version is 0
message GrafanaAssertsNotificationAlertsConfig {
  // Labels to add to alerts generated by this configuration.
  map<string, string> alert_labels = 1 [json_name = "alert_labels"];

  // Duration for which the condition must be true before firing (e.g., '5m', '30s').
  // Maps to 'for' in Asserts API.
  string duration = 2;

  string id = 3;

  // Labels to match for this alert configuration.
  map<string, string> match_labels = 4 [json_name = "match_labels"];

  // The name of the alert configuration.
  string name = 5;

  // Whether this alert configuration is silenced. Defaults to `false`.
  bool silenced = 6;

  google.protobuf.Value for_each = 7 [json_name = "for_each"];

  repeated string depends_on = 8 [json_name = "depends_on"];

  int32 count = 9;

  string provider = 10;

  terraform.v1.Lifecycle lifecycle = 11;
}

