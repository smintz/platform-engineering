  string id = 1;

  // An optional human-readable name for this AWS Account resource.
  string name = 2;

  // A set of regions that this AWS Account resource applies to.
  repeated string regions = 3;

  // The ID given by the Grafana Cloud Provider API to this AWS Account resource.
  string resource_id = 4 [json_name = "resource_id"];

  // An IAM Role ARN string to represent with this AWS Account resource.
  string role_arn = 5 [json_name = "role_arn"];

  // The StackID of the Grafana Cloud instance. Part of the Terraform Resource ID.
  string stack_id = 6 [json_name = "stack_id"];

  google.protobuf.Value for_each = 7 [json_name = "for_each"];

  repeated string depends_on = 8 [json_name = "depends_on"];

  int32 count = 9;

  string provider = 10;

  terraform.v1.Lifecycle lifecycle = 11;
}

// GrafanaCloudProviderAwsCloudwatchScrapeJob version is 0
message GrafanaCloudProviderAwsCloudwatchScrapeJob {
  // The ID assigned by the Grafana Cloud Provider API to an AWS Account resource that
  // should be associated with this CloudWatch Scrape Job. This can be provided by the
  // `resource_id` attribute of the `grafana_cloud_provider_aws_account` resource.
  string aws_account_resource_id = 1 [json_name = "aws_account_resource_id"];

  // When the AWS CloudWatch Scrape Job is disabled, this will show the reason that it
  // is in that state.
  string disabled_reason = 2 [json_name = "disabled_reason"];

  // Whether the AWS CloudWatch Scrape Job is enabled or not. Defaults to `true`.
  bool enabled = 3;

  // When enabled, AWS resource tags are exported as Prometheus labels to metrics
  // formatted as `aws_<service_name>_info`. Defaults to `true`.
  bool export_tags = 4 [json_name = "export_tags"];

  // The Terraform Resource ID. This has the format "{{ stack_id }}:{{ name }}".
  string id = 5;

  // The name of the AWS CloudWatch Scrape Job. Part of the Terraform Resource ID.
  string name = 6;

  // A subset of the regions that are configured in the associated AWS Account
  // resource to apply to this scrape job. If not set or empty, all of the Account
  // resource's regions are scraped.
  repeated string regions_subset_override = 7 [json_name = "regions_subset_override"];

  // The Stack ID of the Grafana Cloud instance. Part of the Terraform Resource ID.
  string stack_id = 8 [json_name = "stack_id"];

  // A set of static labels to add to all metrics exported by this scrape job.
  map<string, string> static_labels = 9 [json_name = "static_labels"];

  repeated CustomNamespace custom_namespace = 10 [json_name = "custom_namespace"];

  repeated Service service = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;

  message CustomNamespace {
    // The name of the custom namespace to scrape.
    string name = 1;

    // The interval in seconds to scrape the custom namespace. Defaults to `300`.
    int64 scrape_interval_seconds = 2 [json_name = "scrape_interval_seconds"];

    repeated Metric metric = 3;

    message Metric {
      // The name of the metric to scrape.
      string name = 1;

      // A set of statistics to scrape.
      repeated string statistics = 2;
    }
  }

  message Service {
    // The name of the service to scrape. See
    // ud/monitor-infrastructure/monitor-cloud-provider/aws/cloudwatch-metrics/services/
    // for supported services.
    string name = 1;

    // The interval in seconds to scrape the service. See
    // ud/monitor-infrastructure/monitor-cloud-provider/aws/cloudwatch-metrics/services/
    // for supported scrape intervals. Defaults to `300`.
    int64 scrape_interval_seconds = 2 [json_name = "scrape_interval_seconds"];

    // A set of tags to add to all metrics exported by this scrape job, for use in
    // PromQL queries.
    repeated string tags_to_add_to_metrics = 3 [json_name = "tags_to_add_to_metrics"];

    repeated Metric metric = 4;

    repeated ResourceDiscoveryTagFilter resource_discovery_tag_filter = 5 [json_name = "resource_discovery_tag_filter"];

    message Metric {
      // The name of the metric to scrape.
      string name = 1;

      // A set of statistics to scrape.
      repeated string statistics = 2;
    }

    message ResourceDiscoveryTagFilter {
      // The key of the tag filter.
      string key = 1;

      // The value of the tag filter.
      string value = 2;
    }
  }
}

