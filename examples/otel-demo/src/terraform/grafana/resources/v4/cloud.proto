syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaCloudAccessPolicy version is 0
message GrafanaCloudAccessPolicy {
  // Creation date of the access policy.
  string created_at = 1 [json_name = "created_at"];

  // Display name of the access policy. Defaults to the name.
  string display_name = 2 [json_name = "display_name"];

  string id = 3;

  // Name of the access policy.
  string name = 4;

  // ID of the access policy.
  string policy_id = 5 [json_name = "policy_id"];

  // Region where the API is deployed. Generally where the stack is deployed. Use the
  // region list API to get the list of available regions:
  // com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/#list-regions.
  string region = 6;

  // Scopes of the access policy. See
  // ity-and-account-management/authentication-and-permissions/access-policies/#scopes
  // for possible values.
  repeated string scopes = 7;

  // Last update date of the access policy.
  string updated_at = 8 [json_name = "updated_at"];

  repeated Conditions conditions = 9;

  repeated Realm realm = 10;

  google.protobuf.Value for_each = 11 [json_name = "for_each"];

  repeated string depends_on = 12 [json_name = "depends_on"];

  int32 count = 13;

  string provider = 14;

  terraform.v1.Lifecycle lifecycle = 15;

  message Conditions {
    // Conditions that apply to the access policy,such as IP Allow lists.
    repeated string allowed_subnets = 1 [json_name = "allowed_subnets"];
  }

  message Realm {
    // The identifier of the org or stack. For orgs, this is the slug, for stacks, this
    // is the stack ID.
    string identifier = 1;

    // Whether a policy applies to a Cloud org or a specific stack. Should be one of
    // `org` or `stack`.
    string type = 2;

    repeated LabelPolicy label_policy = 3 [json_name = "label_policy"];

    message LabelPolicy {
      // The label selector to match in metrics or logs query. Should be in PromQL or
      // LogQL format.
      string selector = 1;
    }
  }
}

// GrafanaCloudAccessPolicyRotatingToken version is 0
message GrafanaCloudAccessPolicyRotatingToken {
  // ID of the access policy for which to create a token.
  string access_policy_id = 1 [json_name = "access_policy_id"];

  // Creation date of the access policy token.
  string created_at = 2 [json_name = "created_at"];

  // Deletes the token in Grafana Cloud when the resource is destroyed in Terraform,
  // instead of leaving it to expire at its `expires_at` time. Use it with `lifecycle
  // { create_before_destroy = true }` to make sure that the new token is created
  // before the old one is deleted. Defaults to `false`.
  bool delete_on_destroy = 3 [json_name = "delete_on_destroy"];

  // Display name of the access policy token. Defaults to the name.
  string display_name = 4 [json_name = "display_name"];

  // Duration of the window before expiring where the token can be rotated (e.g.
  // '24h', '30m', '1h30m'). Valid units are 's' (seconds), 'm' (minutes) and 'h'
  // (hours).
  string early_rotation_window = 5 [json_name = "early_rotation_window"];

  // Duration after which the token will expire (e.g. '24h', '30m', '1h30m'). Valid
  // units are 's' (seconds), 'm' (minutes) and 'h' (hours).
  string expire_after = 6 [json_name = "expire_after"];

  // Expiration date of the access policy token.
  string expires_at = 7 [json_name = "expires_at"];

  string id = 8;

  // Name of the access policy token.
  string name = 9;

  // Prefix for the name of the access policy token. The actual name will be stored in
  // the computed field `name`, which will be in the format
  // '<name_prefix>-<expiration_timestamp>'
  string name_prefix = 10 [json_name = "name_prefix"];

  // Signals that the token is either expired or within the period to be early
  // rotated.
  bool ready_for_rotation = 11 [json_name = "ready_for_rotation"];

  // Region of the access policy. Should be set to the same region as the access
  // policy. Use the region list API to get the list of available regions:
  // com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/#list-regions.
  string region = 12;

  string token = 13;

  // Last update date of the access policy token.
  string updated_at = 14 [json_name = "updated_at"];

  google.protobuf.Value for_each = 15 [json_name = "for_each"];

  repeated string depends_on = 16 [json_name = "depends_on"];

  int32 count = 17;

  string provider = 18;

  terraform.v1.Lifecycle lifecycle = 19;
}

