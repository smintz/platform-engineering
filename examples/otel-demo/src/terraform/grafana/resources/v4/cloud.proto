// GrafanaCloudProviderAzureCredential version is 0
message GrafanaCloudProviderAzureCredential {
  // The client ID of the Azure Credential.
  string client_id = 1 [json_name = "client_id"];

  // The client secret of the Azure Credential.
  string client_secret = 2 [json_name = "client_secret"];

  // Whether the Azure Credential is enabled or not. Defaults to `true`.
  bool enabled = 3;

  // The Terraform Resource ID. This has the format "{{ stack_id }}:{{ resource_id
  // }}".
  string id = 4;

  // The name of the Azure Credential.
  string name = 5;

  // The ID given by the Grafana Cloud Provider API to this Azure Credential resource.
  string resource_id = 6 [json_name = "resource_id"];

  // The list of resource tags to add to metrics.
  repeated string resource_tags_to_add_to_metrics = 7 [json_name = "resource_tags_to_add_to_metrics"];

  // The StackID of the Grafana Cloud instance. Part of the Terraform Resource ID.
  string stack_id = 8 [json_name = "stack_id"];

  // A set of static labels to add to all metrics exported using this credential.
  map<string, string> static_labels = 9 [json_name = "static_labels"];

  // The tenant ID of the Azure Credential.
  string tenant_id = 10 [json_name = "tenant_id"];

  repeated AutoDiscoveryConfiguration auto_discovery_configuration = 11 [json_name = "auto_discovery_configuration"];

  repeated ResourceDiscoveryTagFilter resource_discovery_tag_filter = 12 [json_name = "resource_discovery_tag_filter"];

  google.protobuf.Value for_each = 13 [json_name = "for_each"];

  repeated string depends_on = 14 [json_name = "depends_on"];

  int32 count = 15;

  string provider = 16;

  terraform.v1.Lifecycle lifecycle = 17;

  message AutoDiscoveryConfiguration {
    // The list of resource type configurations.
    repeated ResourceTypeConfigurations resource_type_configurations = 1 [json_name = "resource_type_configurations"];

    // The subscription ID of the Azure account.
    string subscription_id = 2 [json_name = "subscription_id"];

    message ResourceTypeConfigurations {
      // metric_configuration: list of object
      repeated MetricConfiguration metric_configuration = 1 [json_name = "metric_configuration"];

      // resource_type_name: string
      string resource_type_name = 2 [json_name = "resource_type_name"];

      message MetricConfiguration {
        // aggregations: list of string
        repeated string aggregations = 1;

        // dimensions: list of string
        repeated string dimensions = 2;

        // name: string
        string name = 3;
      }
    }
  }

  message ResourceDiscoveryTagFilter {
    // The key of the tag filter.
    string key = 1;

    // The value of the tag filter.
    string value = 2;
  }
}

