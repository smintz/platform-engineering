syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaSyntheticMonitoringCheck version is 0
message GrafanaSyntheticMonitoringCheck {
  // Can be set to `none`, `low`, `medium`, or `high` to correspond to the check
  // [alert
  // ud/testing/synthetic-monitoring/configure-alerts/synthetic-monitoring-alerting/).
  // Defaults to `none`.
  string alert_sensitivity = 1 [json_name = "alert_sensitivity"];

  // Metrics are reduced by default. Set this to `false` if you'd like to publish all
  // metrics. We maintain a [full list of
  // ithub.com/grafana/synthetic-monitoring-agent/tree/main/internal/scraper/testdata)
  // collected for each. Defaults to `true`.
  bool basic_metrics_only = 2 [json_name = "basic_metrics_only"];

  // Whether to enable the check. Defaults to `true`.
  bool enabled = 3;

  // The UID of the Grafana folder to associate the check with.
  string folder_uid = 4 [json_name = "folder_uid"];

  // How often the check runs in milliseconds (the value is not truly a "frequency"
  // but a "period"). The minimum acceptable value is 1 second (1000 ms), and the
  // maximum is 1 hour (3600000 ms). Defaults to `60000`.
  int64 frequency = 5;

  // The ID of the check.
  string id = 6;

  // Name used for job label.
  string job = 7;

  // Custom labels to be included with collected metrics and logs. The maximum number
  // of labels that can be specified per check is 5. These are applied, along with the
  // probe-specific labels, to the outgoing metrics. The names and values of the
  // labels cannot be empty, and the maximum length is 32 bytes.
  map<string, string> labels = 8;

  // List of probe location IDs where this target will be checked from.
  repeated int64 probes = 9;

  // Hostname to ping.
  string target = 10;

  // The tenant ID of the check.
  int64 tenant_id = 11 [json_name = "tenant_id"];

  // Specifies the maximum running time for the check in milliseconds. The minimum
  // acceptable value is 1 second (1000 ms), and the maximum 180 seconds (180000 ms).
  // Defaults to `3000`.
  int64 timeout = 12;

  Channels channels = 13;

  Settings settings = 14;

  google.protobuf.Value for_each = 15 [json_name = "for_each"];

  repeated string depends_on = 16 [json_name = "depends_on"];

  int32 count = 17;

  string provider = 18;

  terraform.v1.Lifecycle lifecycle = 19;

  message Channels {
    K6 k6 = 1;

    message K6 {
      // The ID of the k6 channel.
      string id = 1;
    }
  }

  message Settings {
    Browser browser = 1;

    Dns dns = 2;

    Grpc grpc = 3;

    Http http = 4;

    Multihttp multihttp = 5;

    Ping ping = 6;

    Scripted scripted = 7;

    Tcp tcp = 8;

    Traceroute traceroute = 9;

    message Browser {
      string script = 1;
    }

    message Dns {
      // Options are `V4`, `V6`, `Any`. Specifies whether the corresponding check will be
      // performed using IPv4 or IPv6. The `Any` value indicates that IPv6 should be used,
      // falling back to IPv4 if that's not available. Defaults to `V4`.
      string ip_version = 1 [json_name = "ip_version"];

      // Port to target. Defaults to `53`.
      int64 port = 2;

      // `TCP` or `UDP`. Defaults to `UDP`.
      string protocol = 3;

      // One of `ANY`, `A`, `AAAA`, `CNAME`, `MX`, `NS`, `PTR`, `SOA`, `SRV`, `TXT`.
      // Defaults to `A`.
      string record_type = 4 [json_name = "record_type"];

      // DNS server address to target. Defaults to `8.8.8.8`.
      string server = 5;

      // Source IP address.
      string source_ip_address = 6 [json_name = "source_ip_address"];

      // List of valid response codes. Options include `NOERROR`, `BADALG`, `BADMODE`,
      // `BADKEY`, `BADCOOKIE`, `BADNAME`, `BADSIG`, `BADTIME`, `BADTRUNC`, `BADVERS`,
      // `FORMERR`, `NOTIMP`, `NOTAUTH`, `NOTZONE`, `NXDOMAIN`, `NXRRSET`, `REFUSED`,
      // `SERVFAIL`, `YXDOMAIN`, `YXRRSET`.
      repeated string valid_r_codes = 7 [json_name = "valid_r_codes"];

      repeated ValidateAdditionalRrs validate_additional_rrs = 8 [json_name = "validate_additional_rrs"];

      ValidateAnswerRrs validate_answer_rrs = 9 [json_name = "validate_answer_rrs"];

      ValidateAuthorityRrs validate_authority_rrs = 10 [json_name = "validate_authority_rrs"];

      message ValidateAdditionalRrs {
        // Fail if value matches regex.
        repeated string fail_if_matches_regexp = 1 [json_name = "fail_if_matches_regexp"];

        // Fail if value does not match regex.
        repeated string fail_if_not_matches_regexp = 2 [json_name = "fail_if_not_matches_regexp"];
      }

      message ValidateAnswerRrs {
        // Fail if value matches regex.
        repeated string fail_if_matches_regexp = 1 [json_name = "fail_if_matches_regexp"];

        // Fail if value does not match regex.
        repeated string fail_if_not_matches_regexp = 2 [json_name = "fail_if_not_matches_regexp"];
      }

      message ValidateAuthorityRrs {
        // Fail if value matches regex.
        repeated string fail_if_matches_regexp = 1 [json_name = "fail_if_matches_regexp"];

        // Fail if value does not match regex.
        repeated string fail_if_not_matches_regexp = 2 [json_name = "fail_if_not_matches_regexp"];
      }
    }

    message Grpc {
      // Options are `V4`, `V6`, `Any`. Specifies whether the corresponding check will be
      // performed using IPv4 or IPv6. The `Any` value indicates that IPv6 should be used,
      // falling back to IPv4 if that's not available. Defaults to `V4`.
      string ip_version = 1 [json_name = "ip_version"];

      // gRPC service.
      string service = 2;

      // Whether or not TLS is used when the connection is initiated. Defaults to `false`.
      bool tls = 3;

      TlsConfig tls_config = 4 [json_name = "tls_config"];

      message TlsConfig {
        // CA certificate in PEM format.
        string ca_cert = 1 [json_name = "ca_cert"];

        // Client certificate in PEM format.
        string client_cert = 2 [json_name = "client_cert"];

        // Client key in PEM format.
        string client_key = 3 [json_name = "client_key"];

        // Disable target certificate validation. Defaults to `false`.
        bool insecure_skip_verify = 4 [json_name = "insecure_skip_verify"];

        // Used to verify the hostname for the targets.
        string server_name = 5 [json_name = "server_name"];
      }
    }

    message Http {
      // Token for use with bearer authorization header.
      string bearer_token = 1 [json_name = "bearer_token"];

      // The body of the HTTP request used in probe.
      string body = 2;

      // The name of the query parameter used to prevent the server from using a cached
      // response. Each probe will assign a random value to this parameter each time a
      // request is made.
      string cache_busting_query_param_name = 3 [json_name = "cache_busting_query_param_name"];

      // Check fails if the response body is not compressed using this compression
      // algorithm. One of `none`, `identity`, `br`, `gzip`, `deflate`.
      string compression = 4;

      // List of regexes. If any match the response body, the check will fail.
      repeated string fail_if_body_matches_regexp = 5 [json_name = "fail_if_body_matches_regexp"];

      // List of regexes. If any do not match the response body, the check will fail.
      repeated string fail_if_body_not_matches_regexp = 6 [json_name = "fail_if_body_not_matches_regexp"];

      // Fail if SSL is not present. Defaults to `false`.
      bool fail_if_not_ssl = 7 [json_name = "fail_if_not_ssl"];

      // Fail if SSL is present. Defaults to `false`.
      bool fail_if_ssl = 8 [json_name = "fail_if_ssl"];

      // The HTTP headers set for the probe.
      repeated string headers = 9;

      // Options are `V4`, `V6`, `Any`. Specifies whether the corresponding check will be
      // performed using IPv4 or IPv6. The `Any` value indicates that IPv6 should be used,
      // falling back to IPv4 if that's not available. Defaults to `V4`.
      string ip_version = 10 [json_name = "ip_version"];

      // Request method. One of `GET`, `CONNECT`, `DELETE`, `HEAD`, `OPTIONS`, `POST`,
      // `PUT`, `TRACE` Defaults to `GET`.
      string method = 11;

      // Do not follow redirects. Defaults to `false`.
      bool no_follow_redirects = 12 [json_name = "no_follow_redirects"];

      // The HTTP headers sent to the proxy URL
      repeated string proxy_connect_headers = 13 [json_name = "proxy_connect_headers"];

      // Proxy URL.
      string proxy_url = 14 [json_name = "proxy_url"];

      // Enable secret manager so that `${secrets.<name>}` references in the bearer token,
      // basic auth password, and TLS certificate/key fields are resolved from Grafana
      // Secrets Manager at check time. In Terraform HCL, escape the leading `$`
      // (`$${secrets.<name>}`) so the reference is passed through literally rather than
      // interpolated by Terraform. All probes assigned to the check must support protocol
      // secrets, otherwise the API rejects the check. Defaults to `false`.
      bool secret_manager_enabled = 15 [json_name = "secret_manager_enabled"];

      // List of valid HTTP versions. Options include `HTTP/1.0`, `HTTP/1.1`, `HTTP/2.0`
      repeated string valid_http_versions = 16 [json_name = "valid_http_versions"];

      // Accepted status codes. If unset, defaults to 2xx.
      repeated int64 valid_status_codes = 17 [json_name = "valid_status_codes"];

      BasicAuth basic_auth = 18 [json_name = "basic_auth"];

      repeated FailIfHeaderMatchesRegexp fail_if_header_matches_regexp = 19 [json_name = "fail_if_header_matches_regexp"];

      repeated FailIfHeaderNotMatchesRegexp fail_if_header_not_matches_regexp = 20 [json_name = "fail_if_header_not_matches_regexp"];

      TlsConfig tls_config = 21 [json_name = "tls_config"];

      message BasicAuth {
        // Basic auth password.
        string password = 1;

        // Basic auth username.
        string username = 2;
      }

      message FailIfHeaderMatchesRegexp {
        // Allow header to be missing from responses. Defaults to `false`.
        bool allow_missing = 1 [json_name = "allow_missing"];

        // Header name.
        string header = 2;

        // Regex that header value should match.
        string regexp = 3;
      }

      message FailIfHeaderNotMatchesRegexp {
        // Allow header to be missing from responses. Defaults to `false`.
        bool allow_missing = 1 [json_name = "allow_missing"];

        // Header name.
        string header = 2;

        // Regex that header value should match.
        string regexp = 3;
      }

      message TlsConfig {
        // CA certificate in PEM format.
        string ca_cert = 1 [json_name = "ca_cert"];

        // Client certificate in PEM format.
        string client_cert = 2 [json_name = "client_cert"];

        // Client key in PEM format.
        string client_key = 3 [json_name = "client_key"];

        // Disable target certificate validation. Defaults to `false`.
        bool insecure_skip_verify = 4 [json_name = "insecure_skip_verify"];

        // Used to verify the hostname for the targets.
        string server_name = 5 [json_name = "server_name"];
      }
    }

    message Multihttp {
      repeated Entries entries = 1;

      message Entries {
        repeated Assertions assertions = 1;

        Request request = 2;

        repeated Variables variables = 3;

        message Assertions {
          // The condition of the assertion: NOT_CONTAINS, EQUALS, STARTS_WITH, ENDS_WITH,
          // TYPE_OF, CONTAINS
          string condition = 1;

          // The expression of the assertion. Should start with $.
          string expression = 2;

          // The subject of the assertion: RESPONSE_HEADERS, HTTP_STATUS_CODE, RESPONSE_BODY
          string subject = 3;

          // The type of assertion to make: TEXT, JSON_PATH_VALUE, JSON_PATH_ASSERTION,
          // REGEX_ASSERTION
          string type = 4;

          // The value of the assertion
          string value = 5;
        }

        message Request {
          // The HTTP method to use
          string method = 1;

          // The URL for the request
          string url = 2;

          repeated Body body = 3;

          repeated Headers headers = 4;

          repeated QueryFields query_fields = 5 [json_name = "query_fields"];

          message Body {
            // The content encoding of the body
            string content_encoding = 1 [json_name = "content_encoding"];

            // The content type of the body
            string content_type = 2 [json_name = "content_type"];

            // The body payload
            string payload = 3;
          }

          message Headers {
            // Name of the header to send
            string name = 1;

            // Value of the header to send
            string value = 2;
          }

          message QueryFields {
            // Name of the query field to send
            string name = 1;

            // Value of the query field to send
            string value = 2;
          }
        }

        message Variables {
          // The attribute to use when finding the variable value. Only used when type is
          // CSS_SELECTOR
          string attribute = 1;

          // The expression to when finding the variable. Should start with $. Only use when
          // type is JSON_PATH or REGEX
          string expression = 2;

          // The name of the variable to extract
          string name = 3;

          // The method of finding the variable value to extract. JSON_PATH, REGEX,
          // CSS_SELECTOR
          string type = 4;
        }
      }
    }

    message Ping {
      // Set the DF-bit in the IP-header. Only works with ipV4. Defaults to `false`.
      bool dont_fragment = 1 [json_name = "dont_fragment"];

      // Options are `V4`, `V6`, `Any`. Specifies whether the corresponding check will be
      // performed using IPv4 or IPv6. The `Any` value indicates that IPv6 should be used,
      // falling back to IPv4 if that's not available. Defaults to `V4`.
      string ip_version = 2 [json_name = "ip_version"];

      // Payload size. Defaults to `0`.
      int64 payload_size = 3 [json_name = "payload_size"];

      // Source IP address.
      string source_ip_address = 4 [json_name = "source_ip_address"];
    }

    message Scripted {
      string script = 1;
    }

    message Tcp {
      // Options are `V4`, `V6`, `Any`. Specifies whether the corresponding check will be
      // performed using IPv4 or IPv6. The `Any` value indicates that IPv6 should be used,
      // falling back to IPv4 if that's not available. Defaults to `V4`.
      string ip_version = 1 [json_name = "ip_version"];

      // Source IP address.
      string source_ip_address = 2 [json_name = "source_ip_address"];

      // Whether or not TLS is used when the connection is initiated. Defaults to `false`.
      bool tls = 3;

      repeated QueryResponse query_response = 4 [json_name = "query_response"];

      TlsConfig tls_config = 5 [json_name = "tls_config"];

      message QueryResponse {
        // Response to expect.
        string expect = 1;

        // Data to send.
        string send = 2;

        // Upgrade TCP connection to TLS. Defaults to `false`.
        bool start_tls = 3 [json_name = "start_tls"];
      }

      message TlsConfig {
        // CA certificate in PEM format.
        string ca_cert = 1 [json_name = "ca_cert"];

        // Client certificate in PEM format.
        string client_cert = 2 [json_name = "client_cert"];

        // Client key in PEM format.
        string client_key = 3 [json_name = "client_key"];

        // Disable target certificate validation. Defaults to `false`.
        bool insecure_skip_verify = 4 [json_name = "insecure_skip_verify"];

        // Used to verify the hostname for the targets.
        string server_name = 5 [json_name = "server_name"];
      }
    }

    message Traceroute {
      // Maximum TTL for the trace Defaults to `64`.
      int64 max_hops = 1 [json_name = "max_hops"];

      // Maximum number of hosts to travers that give no response Defaults to `15`.
      int64 max_unknown_hops = 2 [json_name = "max_unknown_hops"];

      // Reverse lookup hostnames from IP addresses Defaults to `true`.
      bool ptr_lookup = 3 [json_name = "ptr_lookup"];
    }
  }
}

// GrafanaSyntheticMonitoringCheckAlerts version is 0
message GrafanaSyntheticMonitoringCheckAlerts {
  // List of alerts for the check.
  repeated Alerts alerts = 1;

  // The ID of the check to manage alerts for.
  int64 check_id = 2 [json_name = "check_id"];

  string id = 3;

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;

  message Alerts {
    // name: string
    string name = 1;

    // period: string
    string period = 2;

    // runbook_url: string
    string runbook_url = 3 [json_name = "runbook_url"];

    // threshold: number
    int64 threshold = 4;
  }
}

// GrafanaSyntheticMonitoringInstallation version is 0
message GrafanaSyntheticMonitoringInstallation {
  string id = 1;

  // The [Grafana Cloud access
  // /security-and-account-management/authentication-and-permissions/access-policies/)
  // with the following scopes: `stacks:read`, `metrics:write`, `logs:write`,
  // `traces:write`. This is used to publish metrics and logs to Grafana Cloud stack.
  string metrics_publisher_key = 2 [json_name = "metrics_publisher_key"];

  // Generated token to access the SM API.
  string sm_access_token = 3 [json_name = "sm_access_token"];

  // The ID or slug of the stack to install SM on.
  string stack_id = 4 [json_name = "stack_id"];

  // The URL of the SM API to install SM on. This depends on the stack region, find
  // the list of API URLs here:
  // /testing/synthetic-monitoring/set-up/set-up-private-probes/#probe-api-server-url.
  // A static mapping exists in the provider but it may not contain all the regions.
  // If it does contain the stack's region, this field is computed automatically and
  // readable.
  string stack_sm_api_url = 5 [json_name = "stack_sm_api_url"];

  google.protobuf.Value for_each = 6 [json_name = "for_each"];

  repeated string depends_on = 7 [json_name = "depends_on"];

  int32 count = 8;

  string provider = 9;

  terraform.v1.Lifecycle lifecycle = 10;
}

// GrafanaSyntheticMonitoringProbe version is 0
message GrafanaSyntheticMonitoringProbe {
  // The probe authentication token. Your probe must use this to authenticate with
  // Grafana Cloud.
  string auth_token = 1 [json_name = "auth_token"];

  // Disables browser checks for this probe. Defaults to `false`.
  bool disable_browser_checks = 2 [json_name = "disable_browser_checks"];

  // Disables scripted checks for this probe. Defaults to `false`.
  bool disable_scripted_checks = 3 [json_name = "disable_scripted_checks"];

  // The ID of the probe.
  string id = 4;

  // Custom labels to be included with collected metrics and logs. The maximum number
  // of labels for private probes is 3.
  map<string, string> labels = 5;

  // Latitude coordinates.
  int64 latitude = 6;

  // Longitude coordinates.
  int64 longitude = 7;

  // Name of the probe.
  string name = 8;

  // Public probes are run by Grafana Labs and can be used by all users. Only Grafana
  // Labs managed public probes will be set to `true`. Defaults to `false`.
  bool public = 9;

  // Region of the probe.
  string region = 10;

  // The tenant ID of the probe.
  int64 tenant_id = 11 [json_name = "tenant_id"];

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;
}
