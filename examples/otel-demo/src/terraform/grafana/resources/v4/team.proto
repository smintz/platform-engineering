syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaTeam version is 0
message GrafanaTeam {
  // A set of email addresses corresponding to users who should be given administrator
  // membership to the team. Note: users specified here must already exist in Grafana.
  // When omitted after being set, users moved into `members` are demoted;
  // administrators only present in state (for example from the UI) are preserved
  // until `admins` is set explicitly, including to `[]`.
  repeated string admins = 1;

  // An email address for the team.
  string email = 2;

  string id = 3;

  // Ignores team members that have been added to team by [Team
  // a.com/docs/grafana/latest/setup-grafana/configure-security/configure-team-sync/).
  // Team Sync can be provisioned using [grafana_team_external_group
  // erraform.io/providers/grafana/grafana/latest/docs/resources/team_external_group).
  bool ignore_externally_synced_members = 4 [json_name = "ignore_externally_synced_members"];

  // A set of email addresses corresponding to users who should be given ordinary
  // membership to the team. Use `admins` to grant team administrator rights. Note:
  // users specified here must already exist in Grafana.
  repeated string members = 5;

  // The display name for the Grafana team created.
  string name = 6;

  // The Organization ID. If not set, the default organization is used for basic
  // authentication, or the one that owns your service account for token
  // authentication.
  string org_id = 7 [json_name = "org_id"];

  // The team id assigned to this team by Grafana.
  int64 team_id = 8 [json_name = "team_id"];

  // The team uid assigned to this team by Grafana.
  string team_uid = 9 [json_name = "team_uid"];

  repeated Preferences preferences = 10;

  repeated TeamSync team_sync = 11 [json_name = "team_sync"];

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;

  message Preferences {
    // The UID of the dashboard to display when a team member logs in.
    string home_dashboard_uid = 1 [json_name = "home_dashboard_uid"];

    // The default theme for this team. Available themes are `light`, `dark`, `system`,
    // or an empty string for the default theme.
    string theme = 2;

    // The default timezone for this team. Available values are `utc`, `browser`, or an
    // empty string for the default.
    string timezone = 3;

    // The default week start day for this team. Available values are `sunday`,
    // `monday`, `saturday`, or an empty string for the default.
    string week_start = 4 [json_name = "week_start"];
  }

  message TeamSync {
    repeated string groups = 1;
  }
}

// GrafanaTeamExternalGroup version is 0
message GrafanaTeamExternalGroup {
  // The team external groups list
  repeated string groups = 1;

  string id = 2;

  // The Team ID
  string team_id = 3 [json_name = "team_id"];

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;
}
