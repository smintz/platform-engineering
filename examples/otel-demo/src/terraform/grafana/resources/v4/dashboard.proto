syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaDashboard version is 1
message GrafanaDashboard {
  // The complete dashboard model JSON.
  //
  //
  // Starting with Grafana v13, use the resource corresponding to your dashboard's API
  // version for Kubernetes-style dashboards.
  //
  //
  // If you decide to use this legacy resource with a Kubernetes-style dashboard
  // definition:
  //
  // - In Grafana v12, provide the "spec" field of the dashboard definition.
  //
  // - In Grafana v13 and later, provide the full Kubernetes-style dashboard JSON
  // (including "apiVersion", "kind", "metadata", and "spec").
  optional string config_json = 1 [json_name = "config_json"];

  // The numeric ID of the dashboard computed by Grafana.
  optional int64 dashboard_id = 2 [json_name = "dashboard_id"];

  // The id or UID of the folder to save the dashboard in.
  optional string folder = 3;

  optional string id = 4;

  // Set a commit message for the version history.
  optional string message = 5;

  // The Organization ID. If not set, the Org ID defined in the provider block will be
  // used.
  optional string org_id = 6 [json_name = "org_id"];

  // Set to true if you want to overwrite existing dashboard with newer version, same
  // dashboard title in folder or same dashboard uid.
  optional bool overwrite = 7;

  // The unique identifier of a dashboard. This is used to construct its URL. It's
  // automatically generated if not provided when creating a dashboard. The uid allows
  // having consistent URLs for accessing dashboards and when syncing dashboards
  // between multiple Grafana installs.
  optional string uid = 8;

  // The full URL of the dashboard.
  optional string url = 9;

  // Whenever you save a version of your dashboard, a copy of that version is saved so
  // that previous versions of your dashboard are not lost.
  optional int64 version = 10;

  google.protobuf.Value for_each = 11 [json_name = "for_each"];

  repeated string depends_on = 12 [json_name = "depends_on"];

  optional int32 count = 13;

  optional string provider = 14;

  terraform.v1.Lifecycle lifecycle = 15;
}

// GrafanaDashboardPermission version is 0
message GrafanaDashboardPermission {
  // UID of the dashboard to apply permissions to.
  optional string dashboard_uid = 1 [json_name = "dashboard_uid"];

  optional string id = 2;

  // The Organization ID. If not set, the default organization is used for basic
  // authentication, or the one that owns your service account for token
  // authentication.
  optional string org_id = 3 [json_name = "org_id"];

  repeated Permissions permissions = 4;

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  optional int32 count = 7;

  optional string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;

  message Permissions {
    // Permission to associate with item. Options: View, Edit, Admin.
    optional string permission = 1;

    // Name of the basic role to manage permissions for. Options: `Viewer`, `Editor` or
    // `Admin`.
    optional string role = 2;

    // ID of the team to manage permissions for.
    optional string team_id = 3 [json_name = "team_id"];

    // ID of the user or service account to manage permissions for.
    optional string user_id = 4 [json_name = "user_id"];
  }
}

// GrafanaDashboardPermissionItem version is 0
message GrafanaDashboardPermissionItem {
  // The UID of the dashboard.
  optional string dashboard_uid = 1 [json_name = "dashboard_uid"];

  optional string id = 2;

  // The Organization ID. If not set, the default organization is used for basic
  // authentication, or the one that owns your service account for token
  // authentication.
  optional string org_id = 3 [json_name = "org_id"];

  // the permission to be assigned
  optional string permission = 4;

  // the role onto which the permission is to be assigned
  optional string role = 5;

  // the team onto which the permission is to be assigned
  optional string team = 6;

  // the user or service account onto which the permission is to be assigned
  optional string user = 7;

  google.protobuf.Value for_each = 8 [json_name = "for_each"];

  repeated string depends_on = 9 [json_name = "depends_on"];

  optional int32 count = 10;

  optional string provider = 11;

  terraform.v1.Lifecycle lifecycle = 12;
}

// GrafanaDashboardPublic version is 0
message GrafanaDashboardPublic {
  // A public unique identifier of a public dashboard. This is used to construct its
  // URL. It's automatically generated if not provided when creating a public
  // dashboard.
  optional string access_token = 1 [json_name = "access_token"];

  // Set to `true` to show annotations. The default value is `false`.
  optional bool annotations_enabled = 2 [json_name = "annotations_enabled"];

  // The unique identifier of the original dashboard.
  optional string dashboard_uid = 3 [json_name = "dashboard_uid"];

  // The ID of this resource.
  optional string id = 4;

  // Set to `true` to enable the public dashboard. The default value is `false`.
  optional bool is_enabled = 5 [json_name = "is_enabled"];

  // The Organization ID. If not set, the default organization is used for basic
  // authentication, or the one that owns your service account for token
  // authentication.
  optional string org_id = 6 [json_name = "org_id"];

  // Set the share mode. The default value is `public`.
  optional string share = 7;

  // Set to `true` to enable the time picker in the public dashboard. The default
  // value is `false`.
  optional bool time_selection_enabled = 8 [json_name = "time_selection_enabled"];

  // The unique identifier of a public dashboard. It's automatically generated if not
  // provided when creating a public dashboard.
  optional string uid = 9;

  google.protobuf.Value for_each = 10 [json_name = "for_each"];

  repeated string depends_on = 11 [json_name = "depends_on"];

  optional int32 count = 12;

  optional string provider = 13;

  terraform.v1.Lifecycle lifecycle = 14;
}
