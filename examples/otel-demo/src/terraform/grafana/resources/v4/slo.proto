syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaSlo version is 0
message GrafanaSlo {
  // Description is a free-text field that can provide more context to an SLO.
  string description = 1;

  // UID for the SLO folder. Must be non-empty if set; omit the attribute entirely to
  // associate the SLO with the default Grafana SLO folder.
  string folder_uid = 2 [json_name = "folder_uid"];

  // The Terraform resource ID (same as UUID).
  string id = 3;

  // Name should be a short description of your indicator. Consider names like "API
  // Availability"
  string name = 4;

  // A Knowledge Graph search expression scoping this SLO to a set of entities, for
  // example "shipping connected services". When set, the SLO links to the Asserts RCA
  // workbench from the SLO list and performance pages, and generated burn-rate alert
  // rules carry a `workbench_troubleshoot_url` annotation pointing at the matching
  // entities. See [predefined
  // edge-graph/troubleshoot-infra-apps/explore-entity-graph/#use-predefined-searches)
  // for the expression syntax. Must be non-empty if set; omit the attribute entirely
  // to leave it unset.
  string search_expression = 5 [json_name = "search_expression"];

  // UUID for the SLO. Custom UUIDs can be set. If not provided, a random UUID will be
  // generated by the API.
  string uuid = 6;

  repeated Alerting alerting = 7;

  repeated DestinationDatasource destination_datasource = 8 [json_name = "destination_datasource"];

  repeated Label label = 9;

  repeated Objectives objectives = 10;

  repeated Query query = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;

  message Alerting {
    repeated AdvancedOptions advanced_options = 1 [json_name = "advanced_options"];

    repeated Annotation annotation = 2;

    repeated Fastburn fastburn = 3;

    repeated Label label = 4;

    repeated Slowburn slowburn = 5;

    message AdvancedOptions {
      // Minimum number of failed events to trigger an alert
      int64 min_failures = 1 [json_name = "min_failures"];
    }

    message Annotation {
      // Key for filtering and identification
      string key = 1;

      // Templatable value
      string value = 2;
    }

    message Fastburn {
      repeated Annotation annotation = 1;

      repeated Enrichment enrichment = 2;

      repeated Label label = 3;

      message Annotation {
        // Key for filtering and identification
        string key = 1;

        // Templatable value
        string value = 2;
      }

      message Enrichment {
        // Type of the alert enrichment. Currently only "assistantInvestigation" is
        // supported.
        string type = 1;
      }

      message Label {
        // Key for filtering and identification
        string key = 1;

        // Templatable value
        string value = 2;
      }
    }

    message Label {
      // Key for filtering and identification
      string key = 1;

      // Templatable value
      string value = 2;
    }

    message Slowburn {
      repeated Annotation annotation = 1;

      repeated Enrichment enrichment = 2;

      repeated Label label = 3;

      message Annotation {
        // Key for filtering and identification
        string key = 1;

        // Templatable value
        string value = 2;
      }

      message Enrichment {
        // Type of the alert enrichment. Currently only "assistantInvestigation" is
        // supported.
        string type = 1;
      }

      message Label {
        // Key for filtering and identification
        string key = 1;

        // Templatable value
        string value = 2;
      }
    }
  }

  message DestinationDatasource {
    // UID for the Datasource
    string uid = 1;
  }

  message Label {
    // Key for filtering and identification
    string key = 1;

    // Templatable value
    string value = 2;
  }

  message Objectives {
    // Value between 0 and 1. If the value of the query is above the objective, the SLO
    // is met.
    int64 value = 1;

    // A Prometheus-parsable time duration string like 24h, 60m. This is the time window
    // the objective is measured over.
    string window = 2;
  }

  message Query {
    // Query type must be one of: "freeform", "query", "ratio", "grafana_queries" or
    // "threshold"
    string type = 1;

    repeated Freeform freeform = 2;

    repeated GrafanaQueries grafana_queries = 3 [json_name = "grafana_queries"];

    repeated Ratio ratio = 4;

    message Freeform {
      // Freeform Query Field - valid promQl
      string query = 1;
    }

    message GrafanaQueries {
      // Query Object - Array of Grafana Query JSON objects
      string grafana_queries = 1 [json_name = "grafana_queries"];
    }

    message Ratio {
      // Defines Group By Labels used for per-label alerting. These appear as variables on
      // SLO dashboards to enable filtering and aggregation. Labels must adhere to
      // Prometheus label name schema - "^[a-zA-Z_][a-zA-Z0-9_]*$"
      repeated string group_by_labels = 1 [json_name = "group_by_labels"];

      // Counter metric for success events (numerator)
      string success_metric = 2 [json_name = "success_metric"];

      // Metric for total events (denominator)
      string total_metric = 3 [json_name = "total_metric"];
    }
  }
}
