syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaConnectionsMetricsEndpointScrapeJob version is 0
message GrafanaConnectionsMetricsEndpointScrapeJob {
  // Password for basic authentication, use if scrape job is using basic
  // authentication method
  string authentication_basic_password = 1 [json_name = "authentication_basic_password"];

  // Username for basic authentication, use if scrape job is using basic
  // authentication method
  string authentication_basic_username = 2 [json_name = "authentication_basic_username"];

  // Bearer token used for authentication, use if scrape job is using bearer
  // authentication method
  string authentication_bearer_token = 3 [json_name = "authentication_bearer_token"];

  // Method to pass authentication credentials: basic or bearer.
  string authentication_method = 4 [json_name = "authentication_method"];

  // Whether the metrics endpoint scrape job is enabled or not.
  bool enabled = 5;

  // The Terraform Resource ID. This has the format "{{ stack_id }}:{{ name }}".
  string id = 6;

  // The name of the metrics endpoint scrape job. Part of the Terraform Resource ID.
  string name = 7;

  // Frequency for scraping the metrics endpoint: 30, 60, or 120 seconds.
  int64 scrape_interval_seconds = 8 [json_name = "scrape_interval_seconds"];

  // The Stack ID of the Grafana Cloud instance. Part of the Terraform Resource ID.
  string stack_id = 9 [json_name = "stack_id"];

  // The url to scrape metrics from; a valid HTTPs URL is required.
  string url = 10;

  google.protobuf.Value for_each = 11 [json_name = "for_each"];

  repeated string depends_on = 12 [json_name = "depends_on"];

  int32 count = 13;

  string provider = 14;

  terraform.v1.Lifecycle lifecycle = 15;
}
