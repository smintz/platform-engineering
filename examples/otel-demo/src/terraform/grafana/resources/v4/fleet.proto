syntax = "proto3";

// Provider: grafana 4
package terraform.grafana.resources.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// GrafanaFleetManagementCollector version is 0
message GrafanaFleetManagementCollector {
  // Type of the collector. Must be one of: ALLOY, OTEL. Defaults to ALLOY if not
  // specified.
  string collector_type = 1 [json_name = "collector_type"];

  // Whether remote configuration for the collector is enabled or not. If the
  // collector is disabled, it will receive empty configurations from the Fleet
  // Management service
  bool enabled = 2;

  // ID of the collector
  string id = 3;

  // Remote attributes for the collector
  map<string, string> remote_attributes = 4 [json_name = "remote_attributes"];

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  int32 count = 7;

  string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;
}

// GrafanaFleetManagementPipeline version is 0
message GrafanaFleetManagementPipeline {
  // Type of the config. Must be one of: ALLOY, OTEL. Defaults to ALLOY if not
  // specified.
  string config_type = 1 [json_name = "config_type"];

  // Configuration contents of the pipeline to be used by collectors (can be Alloy
  // config syntax or OTel YAML)
  string contents = 2;

  // Whether the pipeline is enabled for collectors
  bool enabled = 3;

  // Server-assigned ID of the pipeline
  string id = 4;

  // Used to match against collectors and assign pipelines to them; follows the syntax
  // of Prometheus Alertmanager matchers
  repeated string matchers = 5;

  // Name of the pipeline which is the unique identifier for the pipeline
  string name = 6;

  // Namespace sent with the pipeline source (always `SOURCE_TYPE_TERRAFORM` in the
  // Fleet Management API). Use a stable value per Terraform root or workspace so the
  // UI shows Terraform as the source and API sync semantics stay consistent. If
  // omitted, the namespace `default` is used.
  string terraform_source_namespace = 7 [json_name = "terraform_source_namespace"];

  google.protobuf.Value for_each = 8 [json_name = "for_each"];

  repeated string depends_on = 9 [json_name = "depends_on"];

  int32 count = 10;

  string provider = 11;

  terraform.v1.Lifecycle lifecycle = 12;
}
