syntax = "proto2";

// Provider: grafana 4
package terraform.grafana.provider.v4;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// Grafana version is 0
message Grafana {
  // API token, basic auth in the `username:password` format or `anonymous` (string
  // literal). May alternatively be set via the `GRAFANA_AUTH` environment variable.
  optional string auth = 1;

  // Certificate CA bundle (file path or literal value) to use to verify the Grafana
  // server's certificate. May alternatively be set via the `GRAFANA_CA_CERT`
  // environment variable.
  optional string ca_cert = 2 [json_name = "ca_cert"];

  // Access Policy Token for Grafana Cloud. May alternatively be set via the
  // `GRAFANA_CLOUD_ACCESS_POLICY_TOKEN` environment variable.
  optional string cloud_access_policy_token = 3 [json_name = "cloud_access_policy_token"];

  // Grafana Cloud's API URL. May alternatively be set via the `GRAFANA_CLOUD_API_URL`
  // environment variable.
  optional string cloud_api_url = 4 [json_name = "cloud_api_url"];

  // A Grafana Cloud Provider access token. May alternatively be set via the
  // `GRAFANA_CLOUD_PROVIDER_ACCESS_TOKEN` environment variable.
  optional string cloud_provider_access_token = 5 [json_name = "cloud_provider_access_token"];

  // A Grafana Cloud Provider backend address. May alternatively be set via the
  // `GRAFANA_CLOUD_PROVIDER_URL` environment variable.
  optional string cloud_provider_url = 6 [json_name = "cloud_provider_url"];

  // A Grafana Connections API access token. May alternatively be set via the
  // `GRAFANA_CONNECTIONS_API_ACCESS_TOKEN` environment variable.
  optional string connections_api_access_token = 7 [json_name = "connections_api_access_token"];

  // A Grafana Connections API address. May alternatively be set via the
  // `GRAFANA_CONNECTIONS_API_URL` environment variable.
  optional string connections_api_url = 8 [json_name = "connections_api_url"];

  // A Grafana Fleet Management basic auth in the `username:password` format. May
  // alternatively be set via the `GRAFANA_FLEET_MANAGEMENT_AUTH` environment
  // variable.
  optional string fleet_management_auth = 9 [json_name = "fleet_management_auth"];

  // A Grafana Fleet Management API address. May alternatively be set via the
  // `GRAFANA_FLEET_MANAGEMENT_URL` environment variable.
  optional string fleet_management_url = 10 [json_name = "fleet_management_url"];

  // A Grafana Frontend Observability API access token. May alternatively be set via
  // the `GRAFANA_FRONTEND_O11Y_API_ACCESS_TOKEN` environment variable.
  optional string frontend_o11y_api_access_token = 11 [json_name = "frontend_o11y_api_access_token"];

  // The Grafana Frontend Observability API URL. This is optional, and should only be
  // set to override the default API. May alternatively be set via the
  // `GRAFANA_FRONTEND_O11Y_API_URL` environment variable.
  optional string frontend_o11y_api_url = 12 [json_name = "frontend_o11y_api_url"];

  // Optional. HTTP headers mapping keys to values used for accessing the Grafana and
  // Grafana Cloud APIs. May alternatively be set via the `GRAFANA_HTTP_HEADERS`
  // environment variable in JSON format.
  map<string, string> http_headers = 13 [json_name = "http_headers"];

  // Skip TLS certificate verification. May alternatively be set via the
  // `GRAFANA_INSECURE_SKIP_VERIFY` environment variable.
  optional bool insecure_skip_verify = 14 [json_name = "insecure_skip_verify"];

  // The k6 Cloud API token. May alternatively be set via the
  // `GRAFANA_K6_ACCESS_TOKEN` environment variable.
  optional string k6_access_token = 15 [json_name = "k6_access_token"];

  // The k6 Cloud API url. May alternatively be set via the `GRAFANA_K6_URL`
  // environment variable.
  optional string k6_url = 16 [json_name = "k6_url"];

  // A Grafana OnCall access token. May alternatively be set via the
  // `GRAFANA_ONCALL_ACCESS_TOKEN` environment variable. This is only required when
  // using a dedicated OnCall API token. When using Grafana Cloud, OnCall can be
  // accessed through the `auth` and `url` provider attributes instead.
  optional string oncall_access_token = 17 [json_name = "oncall_access_token"];

  // A Grafana OnCall backend address. May alternatively be set via the
  // `GRAFANA_ONCALL_URL` environment variable. This is only required when using
  // Grafana OnCall OSS. In Grafana Cloud, the OnCall URL is automatically inferred
  // from the Grafana instance URL.
  optional string oncall_url = 18 [json_name = "oncall_url"];

  // The Grafana org ID, if you are using a self-hosted OSS or enterprise Grafana
  // instance. May alternatively be set via the `GRAFANA_ORG_ID` environment variable.
  optional int64 org_id = 19 [json_name = "org_id"];

  // The amount of retries to use for Grafana API and Grafana Cloud API calls. May
  // alternatively be set via the `GRAFANA_RETRIES` environment variable.
  optional int64 retries = 20;

  // The status codes to retry on for Grafana API and Grafana Cloud API calls. Use `x`
  // as a digit wildcard. Defaults to 429 and 5xx. May alternatively be set via the
  // `GRAFANA_RETRY_STATUS_CODES` environment variable.
  repeated string retry_status_codes = 21 [json_name = "retry_status_codes"];

  // The amount of time in seconds to wait between retries for Grafana API and Grafana
  // Cloud API calls. May alternatively be set via the `GRAFANA_RETRY_WAIT`
  // environment variable.
  optional int64 retry_wait = 22 [json_name = "retry_wait"];

  // A Synthetic Monitoring access token. May alternatively be set via the
  // `GRAFANA_SM_ACCESS_TOKEN` environment variable.
  optional string sm_access_token = 23 [json_name = "sm_access_token"];

  // Synthetic monitoring backend address. May alternatively be set via the
  // `GRAFANA_SM_URL` environment variable. The correct value for each service region
  // is cited in the [Synthetic Monitoring
  // testing/synthetic-monitoring/set-up/set-up-private-probes/#probe-api-server-url).
  // Note the `sm_url` value is optional, but it must correspond with the value
  // specified as the `region_slug` in the `grafana_cloud_stack` resource. Also note
  // that when a Terraform configuration contains multiple provider instances managing
  // SM resources associated with the same Grafana stack, specifying an explicit
  // `sm_url` set to the same value for each provider ensures all providers interact
  // with the same SM API.
  optional string sm_url = 24 [json_name = "sm_url"];

  // The Grafana stack ID, if you are using a Grafana Cloud stack. May alternatively
  // be set via the `GRAFANA_STACK_ID` environment variable.
  optional int64 stack_id = 25 [json_name = "stack_id"];

  // Set to true if you want to save only the sha256sum instead of complete dashboard
  // model JSON in the tfstate.
  optional bool store_dashboard_sha256 = 26 [json_name = "store_dashboard_sha256"];

  // Client TLS certificate (file path or literal value) to use to authenticate to the
  // Grafana server. May alternatively be set via the `GRAFANA_TLS_CERT` environment
  // variable.
  optional string tls_cert = 27 [json_name = "tls_cert"];

  // Client TLS key (file path or literal value) to use to authenticate to the Grafana
  // server. May alternatively be set via the `GRAFANA_TLS_KEY` environment variable.
  optional string tls_key = 28 [json_name = "tls_key"];

  // The root URL of a Grafana server. May alternatively be set via the `GRAFANA_URL`
  // environment variable.
  optional string url = 29;

  optional google.protobuf.Value for_each = 30 [json_name = "for_each"];

  repeated string depends_on = 31 [json_name = "depends_on"];

  optional int32 count = 32;

  optional string provider = 33;

  optional terraform.v1.Lifecycle lifecycle = 34;

  optional string alias = 35;

  optional string provider_fqdn = 36 [default = "registry.terraform.io/grafana/grafana"];

  optional string provider_version = 37 [default = "4.45.2"];
}
