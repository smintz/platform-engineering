syntax = "proto3";

// Provider: terraform (built-in) 1
// Hand-written: the terraform_remote_state data source ships with Terraform itself, so
// it is not covered by the protoconf-terraform provider generator.
package terraform.builtin.datasources.v1;

import "terraform/v1/meta.proto";

// TerraformRemoteState version is 0
message TerraformRemoteState {
  string backend = 1;

  map<string, string> config = 2;

  string workspace = 3;

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  .terraform.v1.Lifecycle lifecycle = 7;
}
